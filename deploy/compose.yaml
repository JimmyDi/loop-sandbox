name: loop-sandbox

services:
  api:
    image: ${API_IMAGE:-loop-sandbox-api:local}
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: loop-sandbox-api
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      LOOP_SANDBOX_AUTH_DISABLED: ${LOOP_SANDBOX_AUTH_DISABLED:-0}
      LOOP_SANDBOX_CREDENTIALS: /credentials/credentials.json
      WORKER_IMAGE: ${WORKER_IMAGE:-loop-sandbox-worker:local}
      CONTROLLER_CONTAINER: loop-sandbox-api
      SESSION_DATABASE: /data/sessions.sqlite3
      ALLOW_EGRESS: ${ALLOW_EGRESS:-0}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - ../.loop-sandbox:/credentials:ro
      - session-bindings:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8080/health',headers={'Authorization':'Bearer '+('' if os.getenv('LOOP_SANDBOX_AUTH_DISABLED')=='1' else __import__('json').load(open(os.environ['LOOP_SANDBOX_CREDENTIALS']))['token'])}); urllib.request.urlopen(r,timeout=5).read()"]
      interval: 5s
      timeout: 6s
      retries: 12
    restart: unless-stopped

volumes:
  session-bindings:
