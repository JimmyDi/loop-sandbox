[project]
name = "loop-sandbox"
version = "0.1.0"
description = "Disposable Docker workspaces with HTTP and MCP tools"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "httpx==0.29.0",
    "docker==7.2.0",
    "pydantic==2.14.4",
    "mcp==1.30.0",
]

[project.scripts]
loop-sandbox = "loop_sandbox.server.cli:main"

[project.optional-dependencies]
worker = ["playwright==1.65.2"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.17.6"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loop_sandbox"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["loop_sandbox"]
known-third-party = ["docker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
